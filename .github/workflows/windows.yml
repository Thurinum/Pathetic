name: Windows build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Version stamped into the executable (e.g. 1.2.3).
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Pathetic (win-x64)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          cache: true
          stripdown: true
          install_runtime: false
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build Pathetic.slnx --configuration Release

      - name: Package
        shell: pwsh
        run: build/windows/package.ps1 -Version $env:VERSION -Runtime win-x64
        env:
          VERSION: ${{ inputs.version || format('0.0.{0}', github.run_number) }}

      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: Pathetic-windows-x64
          path: artifacts/Pathetic-windows-x64.zip
          if-no-files-found: error
