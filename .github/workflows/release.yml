name: Release

# Publishes a GitHub release with the macOS and Windows builds attached.
#   - Push a tag:   git tag v1.2.3 && git push origin v1.2.3
#   - Or run manually from the Actions tab with a version; the tag is created on the
#     selected commit.
# Tags with a suffix (v1.2.3-beta.1) are published as pre-releases.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the leading v (e.g. 1.2.3 or 1.2.3-beta.1).
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="${INPUT_VERSION#v}"
          else
            version="${REF_NAME#v}"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not a valid version (expected MAJOR.MINOR.PATCH[-SUFFIX])."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  build-macos:
    name: macOS
    needs: resolve
    uses: ./.github/workflows/macos.yml
    with:
      version: ${{ needs.resolve.outputs.version }}

  build-windows:
    name: Windows
    needs: resolve
    uses: ./.github/workflows/windows.yml
    with:
      version: ${{ needs.resolve.outputs.version }}

  release:
    name: Publish release
    needs: [resolve, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download apps
        uses: actions/download-artifact@v8
        with:
          pattern: Pathetic-*
          merge-multiple: true
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          cd dist
          # Pathetic-<platform>-<arch>.zip -> Pathetic-<version>-<platform>-<arch>.zip
          for file in Pathetic-*.zip; do
            mv "$file" "Pathetic-${VERSION}-${file#Pathetic-}"
          done
          shasum -a 256 Pathetic-*.zip > SHA256SUMS.txt

          notes=$(cat <<NOTES
          ## Download

          Self-contained builds with nothing to install:

          - **macOS (Apple silicon):** \`Pathetic-${VERSION}-macos-arm64.zip\`. Requires macOS 26 or later. The app is not notarized: on first launch, right-click Pathetic.app and choose **Open**.
          - **Windows (x64):** \`Pathetic-${VERSION}-windows-x64.zip\`. Unzip and run \`Pathetic\\Pathetic.App.exe\`. Requires a GPU driver with Vulkan support.
          - **Windows (ARM64):** \`Pathetic-${VERSION}-windows-arm64.zip\`, same as above for Windows on ARM.
          NOTES
          )

          args=(--repo "$GITHUB_REPOSITORY" --title "Pathetic $VERSION" --notes "$notes" --generate-notes)
          if [[ "$VERSION" == *-* ]]; then
            args+=(--prerelease)
          fi

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            args+=(--target "$GITHUB_SHA")
          else
            args+=(--verify-tag)
          fi

          gh release create "$TAG" Pathetic-*.zip SHA256SUMS.txt "${args[@]}"
