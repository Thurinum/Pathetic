name: macOS build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Version stamped into the app bundle (e.g. 1.2.3).
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Pathetic.app (Apple silicon)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build Pathetic.slnx --configuration Release

      - name: Package app bundle
        run: build/macos/package.sh "$VERSION"
        env:
          VERSION: ${{ inputs.version || format('0.0.{0}', github.run_number) }}

      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: Pathetic-macos-arm64
          path: artifacts/Pathetic-macos-arm64.zip
          if-no-files-found: error
