name: macOS build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Pathetic.app (Apple silicon)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build Pathetic.slnx --configuration Release

      - name: Package app bundle
        run: build/macos/package.sh "0.0.${{ github.run_number }}"

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Pathetic-macos-arm64
          path: artifacts/Pathetic-macos-arm64.zip
          if-no-files-found: error
